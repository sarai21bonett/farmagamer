<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¿Qué tanto sabes de medicamentos? 🩺</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(circle at 50% 0%, #0b2a4a 0%, #05101f 70%);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px;
  }

  /* ====== CONTENEDOR TIPO CELULAR (9:16) ====== */
  #gameContainer {
    position: relative;
    width: min(100%, calc((100dvh - 16px) * 9 / 16));
    aspect-ratio: 9 / 16;
    max-height: calc(100dvh - 16px);
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(160deg, #0d1b3e, #05101f);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 4px #1e293b, 0 0 40px rgba(30,144,255,0.35);
    display: flex;
    flex-direction: column;
    container-type: size;
  }

  @media (min-width: 900px) {
    #gameContainer {
      border-radius: 26px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 0 6px #1e293b, 0 0 0 8px #0f172a, 0 0 60px rgba(30,144,255,0.4);
    }
  }

  .game-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 3.5cqw;
    gap: 2.2cqh;
    overflow: hidden;
  }

  /* ====== TÍTULO ====== */
  h1 {
    text-align: center;
    font-size: clamp(0.85rem, 3.6cqw, 1.4rem);
    line-height: 1.25;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
    font-weight: 800;
  }
  h1 small {
    display: block;
    font-size: 0.72em;
    opacity: 0.9;
    letter-spacing: 1px;
  }

  /* ====== COMODINES ====== */
  .lifelines { display: flex; justify-content: center; gap: 2.5cqw; }
  .lifeline {
    flex: 1; max-width: 32%; min-height: 8cqh;
    border-radius: 3cqw; border: 2px solid #1e90ff;
    background: rgba(30,144,255,0.15); color: #fff;
    font-size: clamp(0.55rem, 2.4cqw, 0.8rem);
    font-weight: bold; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; transition: all 0.2s; padding: 2px; touch-action: manipulation;
  }
  .lifeline:active:not(:disabled) { background: rgba(30,144,255,0.45); transform: scale(0.95); }
  .lifeline:disabled { opacity: 0.28; cursor: not-allowed; }
  .lifeline .icon { font-size: clamp(1rem, 4.5cqw, 1.4rem); line-height: 1; }

  /* ====== PREGUNTA ====== */
  .question-box {
    background: linear-gradient(90deg, #0d1b3e, #142850);
    border: 2px solid #4facfe; border-radius: 3.5cqw;
    padding: 2.5cqh 3cqw; min-height: 17cqh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: clamp(0.8rem, 3.3cqw, 1.1rem);
    line-height: 1.35; box-shadow: inset 0 0 20px rgba(0,242,254,0.15);
  }
  .question-number {
    font-size: clamp(0.55rem, 2.3cqw, 0.75rem); color: #4facfe;
    margin-bottom: 0.6cqh; text-transform: uppercase;
    letter-spacing: 1.5px; font-weight: 700;
  }

  /* ====== OPCIONES ====== */
  .options {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr; gap: 1.8cqw; min-height: 0;
  }
  
  .option {
    position: relative; display: flex; align-items: center; gap: 2cqw;
    background: linear-gradient(180deg, #0f2b4d, #081a30); 
    border: 2px solid #4facfe; border-radius: 3cqw;
    padding: 2cqw 2.5cqw; font-size: clamp(0.65rem, 2.8cqw, 0.95rem);
    text-align: left; color: #fff; cursor: pointer;
    transition: all 0.2s; touch-action: manipulation; line-height: 1.25;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.3);
  }

  .option::before {
    content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 40%;
    background: linear-gradient(180deg, rgba(79,172,254,0.2), transparent);
    border-radius: 3cqw 3cqw 50% 50%; pointer-events: none;
  }

  .option:active:not(.disabled) { transform: scale(0.96); background: linear-gradient(180deg, #081a30, #040d1a); }

  .option .letter {
    font-weight: bold; color: #fbbf24; font-size: clamp(0.75rem, 3.2cqw, 1rem);
    flex-shrink: 0; text-shadow: 1px 1px 2px #000; z-index: 1;
  }
  .option span:last-child { z-index: 1; }

  .option.correct {
    background: linear-gradient(180deg, #10b981, #047857) !important;
    border-color: #34d399; animation: pulse 0.5s;
  }
  .option.wrong {
    background: linear-gradient(180deg, #ef4444, #991b1b) !important;
    border-color: #f87171; animation: shake 0.4s;
  }
  .option.disabled { cursor: default; pointer-events: none; }
  .option.hidden-option { visibility: hidden; pointer-events: none; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ====== MENSAJE ====== */
  .message {
    text-align: center; font-size: clamp(0.65rem, 2.6cqw, 0.85rem);
    min-height: 4cqh; color: #4facfe; font-weight: 600;
    line-height: 1.3; padding: 0 2cqw;
  }
  .message.win { color: #05c46b; }
  .message.lose { color: #ff3b3b; }
  .message.warn { color: #ffb400; }

  /* ====== ESCALERA ====== */
  .ladder {
    background: linear-gradient(180deg, rgba(10,25,45,0.95), rgba(5,15,30,0.95));
    border: 2px solid #ffb400; border-radius: 2.5cqw;
    padding: 1.2cqh 2cqw; display: flex; flex-direction: column;
    gap: 0.5cqh; box-shadow: 0 0 20px rgba(255,180,0,0.2);
    max-height: 26cqh; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .ladder::-webkit-scrollbar { display: none; }

  .ladder h2 {
    text-align: center; font-size: clamp(0.55rem, 2.4cqw, 0.8rem);
    color: #ffb400; letter-spacing: 1px; margin-bottom: 0.4cqh;
    position: sticky; top: 0; background: rgba(5,15,30,0.95);
    padding: 2px 0; z-index: 2;
  }
  
  .rung {
    display: flex; justify-content: space-between; padding: 0.6cqh 2.5cqw;
    border-radius: 1.5cqw; font-size: clamp(0.55rem, 2.2cqw, 0.78rem);
    color: #9fc2e0; transition: all 0.3s; border: 1px solid transparent; flex-shrink: 0;
  }
  
  .rung.active {
    background: linear-gradient(90deg, #ffb400, #ffd700);
    color: #05101f; font-weight: bold; transform: scale(1.02);
    box-shadow: 0 0 10px rgba(255,180,0,0.6);
    padding-left: 3.5cqw; padding-right: 3.5cqw;
  }
  .rung.passed { color: #05c46b; border-color: rgba(5,196,107,0.4); }

  /* ============================================================
     BOTÓN REINICIAR
     ============================================================ */
  .restart-btn {
    display: none; 
    margin: 1cqh auto 0; 
    padding: 2.4cqh 12cqw; 
    background: linear-gradient(180deg, #ffd700 0%, #ffb400 50%, #f59e0b 100%);
    color: #05101f; 
    border: 3px solid #fff; 
    border-radius: 4cqw;
    font-weight: 900; 
    font-size: clamp(1rem, 4.5cqw, 1.3rem); 
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer; 
    transition: all 0.15s; 
    touch-action: manipulation;
    box-shadow: 
      0 8px 0 #b45309, 
      0 15px 25px rgba(0,0,0,0.6), 
      inset 0 2px 0 rgba(255,255,255,0.8); 
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }

  .restart-btn:active { 
    transform: translateY(6px); 
    box-shadow: 
      0 2px 0 #b45309, 
      0 5px 10px rgba(0,0,0,0.6),
      inset 0 2px 0 rgba(255,255,255,0.8);
  }
  
  .restart-btn.show { 
    display: block; 
    animation: popInBtn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popInBtn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ====== MODAL PÚBLICO ====== */
  .modal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 4cqw;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: linear-gradient(160deg, #0d1b3e, #05101f);
    border: 2px solid #4facfe; border-radius: 3.5cqw;
    padding: 3cqh 3cqw; width: 100%; box-shadow: 0 0 40px rgba(79,172,254,0.5);
  }
  .modal-content h3 { text-align: center; color: #4facfe; margin-bottom: 2cqh; font-size: clamp(0.8rem, 3.2cqw, 1rem); }
  .bar-row { display: flex; align-items: center; gap: 2cqw; margin: 1.2cqh 0; }
  .bar-row .label { width: 3cqw; font-weight: bold; color: #ffb400; font-size: clamp(0.65rem, 2.6cqw, 0.85rem); }
  .bar-container { flex: 1; height: 2.6cqh; background: #081a30; border-radius: 1.5cqw; overflow: hidden; border: 1px solid #1e90ff; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); width: 0; transition: width 0.8s ease; }
  .bar-row .pct { width: 7cqw; text-align: right; font-size: clamp(0.55rem, 2.2cqw, 0.75rem); color: #9fc2e0; }
  .modal-close {
    display: block; margin: 2cqh auto 0; padding: 1.2cqh 4cqw;
    background: #1e90ff; border: none; border-radius: 2cqw;
    color: #fff; font-weight: bold; font-size: clamp(0.7rem, 2.8cqw, 0.9rem);
    cursor: pointer; touch-action: manipulation;
  }

  /* ============================================================
     PANTALLA DE VICTORIA
     ============================================================ */
  #victoryScreen {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, #0d1b3e, #05101f 90%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
    overflow: hidden; padding: 5cqw;
  }
  #victoryScreen.show { opacity: 1; pointer-events: auto; }

  .glow-bg {
    position: absolute; top: 50%; left: 50%; width: 150cqw; height: 150cqw;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,215,0,0.15) 45deg, transparent 90deg, rgba(255,215,0,0.15) 135deg, transparent 180deg, rgba(255,215,0,0.15) 225deg, transparent 270deg, rgba(255,215,0,0.15) 315deg, transparent 360deg);
    animation: spin 20s linear infinite; pointer-events: none;
  }
  @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

  .victory-content {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; text-align: center;
    transform: translateY(20px) scale(0.9); opacity: 0;
    transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #victoryScreen.show .victory-content { transform: translateY(0) scale(1); opacity: 1; transition-delay: 0.2s; }

  .trophy {
    font-size: clamp(3rem, 18cqw, 6rem); line-height: 1; margin-bottom: 2cqh;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.6)); animation: bounce 2s infinite ease-in-out;
  }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .win-title {
    font-size: clamp(1.6rem, 8cqw, 2.8rem); font-weight: 900; color: #ffd700;
    text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 0 20px rgba(255,215,0,0.5), 2px 2px 0 #000;
    margin-bottom: 1cqh; animation: glow 1.5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 0 20px rgba(255,215,0,0.5), 2px 2px 0 #000; }
    to { text-shadow: 0 0 20px rgba(255,215,0,1), 0 0 40px rgba(255,215,0,0.8), 2px 2px 0 #000; }
  }

  .win-subtitle { font-size: clamp(0.9rem, 4cqw, 1.3rem); color: #fff; margin-bottom: 4cqh; font-weight: 600; line-height: 1.4; }

  .win-prize {
    font-size: clamp(1.4rem, 7cqw, 2.2rem); font-weight: bold; color: #05c46b;
    background: rgba(5, 196, 107, 0.15); border: 2px solid #05c46b;
    padding: 1.5cqh 5cqw; border-radius: 3cqw; margin-bottom: 5cqh;
    box-shadow: 0 0 20px rgba(5, 196, 107, 0.4); text-shadow: 0 0 10px rgba(5, 196, 107, 0.5);
  }

  .win-btn {
    padding: 2cqh 8cqw; font-size: clamp(1rem, 4.5cqw, 1.3rem);
    font-weight: bold; color: #05101f; background: linear-gradient(90deg, #ffd700, #ffb400);
    border: none; border-radius: 3cqw; cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.6);
    transition: transform 0.2s, box-shadow 0.2s; touch-action: manipulation;
  }
  .win-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.4); }

  .confetti { position: absolute; width: 10px; height: 10px; background: #ffd700; opacity: 0.8; top: -20px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110cqh) rotate(720deg); } }

  /* ============================================================
     PANTALLA DE DERROTA
     ============================================================ */
  #defeatScreen {
    position: absolute; inset: 0;
    background: rgba(10, 0, 0, 0.95); 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none; 
    transition: opacity 0.2s ease; 
  }
  #defeatScreen.show { opacity: 1; pointer-events: auto; }

  .defeat-icon {
    font-size: clamp(10rem, 60cqw, 20rem); 
    font-weight: 900; color: #ff3b3b;
    text-shadow: 0 0 40px rgba(255, 59, 59, 1), 0 0 80px rgba(255, 59, 59, 0.8);
    line-height: 1; transform: scale(0); opacity: 0;
  }
  
  .defeat-icon.animate-x {
    animation: 
      popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, 
      flash 0.3s 0.7s ease-out forwards; 
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes flash {
    0% { opacity: 1; transform: scale(1); }
    20% { opacity: 0.5; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.3); }
  }
</style>

<body>

<div id="gameContainer">
  <div class="game-inner">
    <h1>QUE TANTO SABES DE MEDICAMENTOS?🩺 <small>Juego divertido para aprender de farmacia.</small></h1>

    <div class="lifelines">
      <button class="lifeline" id="lifeline-5050" title="50:50">
        <span class="icon">½</span>
        <span>50:50</span>
      </button>
      <button class="lifeline" id="lifeline-call" title="Llamar a un amigo">
        <span class="icon">📞</span>
        <span>Amigo</span>
      </button>
      <button class="lifeline" id="lifeline-audience" title="Ayuda del público">
        <span class="icon">👥</span>
        <span>Público</span>
      </button>
    </div>

    <div class="question-box">
      <div>
        <div class="question-number" id="questionNumber">Pregunta 1</div>
        <div id="questionText">Cargando...</div>
      </div>
    </div>

    <div class="options" id="options"></div>

    <div class="message" id="message"></div>
    
    <button class="restart-btn" id="restartBtn">🔄 JUGAR DE NUEVO</button>

    <div class="ladder" id="ladder">
      <h2>PREMIO</h2>
    </div>
  </div>

  <!-- Modal público -->
  <div class="modal" id="audienceModal">
    <div class="modal-content">
      <h3>👥 Ayuda del público</h3>
      <div id="audienceBars"></div>
      <button class="modal-close" id="closeAudience">Cerrar</button>
    </div>
  </div>

  <!-- PANTALLA DE VICTORIA -->
  <div id="victoryScreen">
    <div class="glow-bg"></div>
    <div class="victory-content">
      <div class="trophy">🏆</div>
      <div class="win-title">¡Felicidades!</div>
      <div class="win-subtitle">¡Eres el nuevo<br>Millonario Farmacéutico!</div>
      <div class="win-prize">$1,000,000</div>
      <button class="win-btn" id="playAgainBtn">Jugar de nuevo</button>
    </div>
  </div>

  <!-- PANTALLA DE DERROTA -->
  <div id="defeatScreen">
    <div class="defeat-icon" id="defeatIcon">✖</div>
  </div>
</div>

<script>
/* ============================================================
   SISTEMA DE AUDIO (Web Audio API)
   ============================================================ */
let audioCtx = null;

// Inicializa el contexto de audio (necesario para navegadores modernos)
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// Función para reproducir un tono
function playTone(frequency, type, duration, vol=0.1, delay=0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
  
  // Envolvente para que no suene de golpe
  gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + delay + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + duration);
}

// Sonido de acierto (Ding ascendente alegre)
function playCorrectSound() {
  initAudio();
  playTone(523.25, 'sine', 0.15, 0.1, 0);    // C5
  playTone(659.25, 'sine', 0.15, 0.1, 0.1);  // E5
  playTone(783.99, 'sine', 0.4, 0.1, 0.2);   // G5
}

// Sonido de error (Buzz grave)
function playWrongSound() {
  initAudio();
  playTone(150, 'sawtooth', 0.3, 0.15, 0);
  playTone(130, 'sawtooth', 0.3, 0.15, 0.1);
}

// Música de victoria (Arpegio feliz)
function playVictorySound() {
  initAudio();
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, i) => {
    playTone(freq, 'triangle', 0.4, 0.1, i * 0.15);
  });
  // Un acorde final
  playTone(523.25, 'sine', 1.5, 0.1, 0.6);
  playTone(659.25, 'sine', 1.5, 0.1, 0.6);
  playTone(783.99, 'sine', 1.5, 0.1, 0.6);
}

/* ============================================================
   BANCO DE PREGUNTAS
   ============================================================ */
const questions = [
  { q: "¿Qué medicamento es el más común para calmar un dolor de cabeza leve?",
    options: ["Paracetamol", "Amoxicilina", "Ibuprofeno", "Vitamina C"], correct: 0, prize: "$100" },
  { q: "¿Cómo se llama el líquido que nos ponen en el brazo para hidratarnos en el hospital?",
    options: ["Suero", "Alcohol", "Agua oxigenada", "Jarabe"], correct: 0, prize: "$200" },
  { q: "¿Qué medicina sirve para bajar la fiebre?",
    options: ["Antibiótico", "Antipirético", "Antiinflamatorio", "Antihistamínico"], correct: 1, prize: "$300" },
  { q: "¿Dónde guardamos las medicinas en casa para que no se dañen?",
    options: ["En el baño", "En la cocina", "En un lugar fresco y seco", "En el congelador"], correct: 2, prize: "$500" },
  { q: "¿Qué tipo de medicamento se usa para combatir infecciones por bacterias?",
    options: ["Analgésico", "Antibiótico", "Jarabe para la tos", "Vitamina"], correct: 1, prize: "$1,000" },
  { q: "Si tienes alergia y te da comezón o estornudos, ¿qué medicamento te suelen dar?",
    options: ["Antigripal", "Antihistamínico", "Antiácido", "Laxante"], correct: 1, prize: "$2,000" },
  { q: "¿Qué es una pastilla?",
    options: ["Un líquido", "Una inyección", "Un medicamento sólido para tragar", "Una crema"], correct: 2, prize: "$4,000" },
  { q: "¿Qué debes hacer antes de tomar cualquier medicamento?",
    options: ["Leer las instrucciones", "Tomarlo con refresco", "Doblar la dosis", "Guardarlo"], correct: 0, prize: "$8,000" },
  { q: "¿Cómo se llama la persona encargada de vender y explicar medicamentos en la farmacia?",
    options: ["El doctor", "El enfermero", "El farmacéutico", "El cajero"], correct: 2, prize: "$16,000" },
  { q: "¿Qué medicina es famosa por ser una vitamina y ayuda a las defensas?",
    options: ["Vitamina D", "Vitamina C", "Vitamina B12", "Omega 3"], correct: 1, prize: "$32,000" },
  { q: "¿Cuál de estos es un método común de administración de medicamentos?",
    options: ["Inyección", "Jarabe", "Pastilla", "Todas son correctas"], correct: 3, prize: "$64,000" },
  { q: "¿Cómo se llama el medicamento que se aplica en la piel para curar heridas?",
    options: ["Jarabe", "Ungüento o crema", "Pastilla", "Inyección"], correct: 1, prize: "$125,000" },
  { q: "Si un medicamento te produce salpullido o te hinchas, esto se llama:",
    options: ["Efecto deseado", "Alergia o reacción", "Sobredosis", "Intoxicación"], correct: 1, prize: "$250,000" },
  { q: "¿Cada cuánto tiempo debes tomar un medicamento si dice 'cada 8 horas'?",
    options: ["Una vez al día", "3 veces al día", "2 veces al día", "Cada hora"], correct: 1, prize: "$500,000" },
  { q: "¿Los antibióticos sirven para curar un resfriado común causado por virus?",
    options: ["Sí, siempre", "No, no sirven para virus", "Solo si es de noche", "Solo para niños"], correct: 1, prize: "$1,000,000" }
];

/* ============================================================
   ESTADO DEL JUEGO
   ============================================================ */
let currentIndex = 0;
let lifelines = { fifty: true, call: true, audience: true };
let answered = false;
let gameOver = false;
let secondChanceUsed = false;

const questionText = document.getElementById('questionText');
const questionNumber = document.getElementById('questionNumber');
const optionsContainer = document.getElementById('options');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restartBtn');
const ladderEl = document.getElementById('ladder');
const victoryScreen = document.getElementById('victoryScreen');
const defeatScreen = document.getElementById('defeatScreen');
const defeatIcon = document.getElementById('defeatIcon');

const btn5050 = document.getElementById('lifeline-5050');
const btnCall = document.getElementById('lifeline-call');
const btnAudience = document.getElementById('lifeline-audience');

const audienceModal = document.getElementById('audienceModal');
const audienceBars = document.getElementById('audienceBars');
const closeAudience = document.getElementById('closeAudience');

/* ============================================================
   ESCALERA
   ============================================================ */
function buildLadder() {
  ladderEl.innerHTML = '<h2>PREMIO</h2>';
  for (let i = 0; i < questions.length; i++) {
    const rung = document.createElement('div');
    rung.className = 'rung';
    rung.dataset.index = i;
    rung.innerHTML = `<span>${i + 1}</span><span>${questions[i].prize}</span>`;
    ladderEl.appendChild(rung);
  }
  updateLadder();
}

function updateLadder() {
  ladderEl.querySelectorAll('.rung').forEach(r => {
    const idx = parseInt(r.dataset.index);
    r.classList.remove('active', 'passed');
    if (idx < currentIndex) r.classList.add('passed');
    if (idx === currentIndex && !gameOver) r.classList.add('active');
  });

  const activeRung = ladderEl.querySelector('.rung.active');
  if (activeRung) {
    activeRung.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

/* ============================================================
   CONFETI
   ============================================================ */
function launchConfetti() {
  const colors = ['#ffd700', '#ffb400', '#05c46b', '#4facfe', '#ffffff'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'cqw';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      confetti.style.animationDelay = (Math.random() * 0.5) + 's';
      if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
      victoryScreen.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }, i * 50);
  }
}

/* ============================================================
   MOSTRAR PREGUNTA
   ============================================================ */
function showQuestion() {
  if (currentIndex >= questions.length) { endGame(true); return; }
  answered = false;
  const q = questions[currentIndex];
  questionNumber.textContent = `Pregunta ${currentIndex + 1} de ${questions.length}`;
  questionText.textContent = q.q;
  messageEl.textContent = '';
  messageEl.className = 'message';

  optionsContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsContainer.appendChild(btn);
  });

  btn5050.disabled = !lifelines.fifty;
  btnCall.disabled = !lifelines.call;
  btnAudience.disabled = !lifelines.audience;

  updateLadder();
}

/* ============================================================
   SELECCIONAR RESPUESTA
   ============================================================ */
function selectAnswer(index) {
  if (answered || gameOver) return;
  
  // Inicializar audio en el primer clic (para que los navegadores lo permitan)
  initAudio();

  answered = true;
  const q = questions[currentIndex];
  const optionBtns = optionsContainer.querySelectorAll('.option');
  optionBtns.forEach(btn => btn.classList.add('disabled'));

  if (index === q.correct) {
    optionBtns[index].classList.add('correct');
    messageEl.textContent = `✅ ¡Correcto! Ganaste ${q.prize}`;
    messageEl.className = 'message win';
    playCorrectSound(); // <--- SONIDO DE ACIERTO
    
    currentIndex++;
    updateLadder();
    setTimeout(() => {
      if (currentIndex >= questions.length) endGame(true);
      else showQuestion();
    }, 1500);
    return;
  }

  // --- SI FALLA ---
  optionBtns[index].classList.add('wrong');
  optionBtns[q.correct].classList.add('correct');
  messageEl.textContent = ''; 
  
  playWrongSound(); // <--- SONIDO DE ERROR
  
  defeatScreen.classList.add('show');
  defeatIcon.classList.add('animate-x');

  if (!secondChanceUsed) {
    secondChanceUsed = true;
    
    setTimeout(() => {
      defeatScreen.classList.remove('show');
      defeatIcon.classList.remove('animate-x');
      
      messageEl.innerHTML = `❌ Era la <b>${'ABCD'[q.correct]}</b>. ¡Tienes <b>una segunda oportunidad</b>!`;
      messageEl.className = 'message warn';
      
      setTimeout(() => {
        currentIndex++;
        updateLadder();
        if (currentIndex >= questions.length) {
          endGame(true);
        } else {
          showQuestion();
          messageEl.textContent = '🛟 Segunda oportunidad usada. ¡Sigue así!';
          messageEl.className = 'message warn';
        }
      }, 1200); 
    }, 1000); 

  } else {
    gameOver = true;
    
    setTimeout(() => {
      defeatScreen.classList.remove('show');
      defeatIcon.classList.remove('animate-x');
      
      const prize = currentIndex > 0 ? questions[currentIndex - 1].prize : '$0';
      restartBtn.classList.add('show'); 
      messageEl.innerHTML = `Te llevas: <b>${prize}</b>`;
      messageEl.className = 'message lose';

    }, 1000); 
  }
}

/* ============================================================
   FIN DEL JUEGO
   ============================================================ */
function endGame(win) {
  gameOver = true;
  optionsContainer.querySelectorAll('.option').forEach(btn => btn.classList.add('disabled'));

  if (win) {
    messageEl.textContent = '';
    victoryScreen.classList.add('show');
    playVictorySound(); // <--- MÚSICA DE VICTORIA
    launchConfetti();
  }
  updateLadder();
}

/* ============================================================
   COMODINES
   ============================================================ */
btn5050.addEventListener('click', () => {
  if (!lifelines.fifty || answered || gameOver) return;
  lifelines.fifty = false;
  btn5050.disabled = true;
  const q = questions[currentIndex];
  const optionBtns = [...optionsContainer.querySelectorAll('.option')];
  const wrongIndices = optionBtns.map((_, i) => i).filter(i => i !== q.correct);
  wrongIndices.sort(() => Math.random() - 0.5);
  wrongIndices.slice(0, 2).forEach(i => optionBtns[i].classList.add('hidden-option'));
  messageEl.textContent = '½ Eliminaste dos respuestas incorrectas';
  messageEl.className = 'message';
});

btnCall.addEventListener('click', () => {
  if (!lifelines.call || answered || gameOver) return;
  lifelines.call = false;
  btnCall.disabled = true;
  const q = questions[currentIndex];
  const letters = ['A', 'B', 'C', 'D'];
  const acierta = Math.random() < 0.8;
  let suggested;
  if (acierta) suggested = q.correct;
  else {
    const wrong = q.options.map((_, i) => i).filter(i => i !== q.correct);
    suggested = wrong[Math.floor(Math.random() * wrong.length)];
  }
  messageEl.textContent = `📞 Tu amigo dice: "Yo creo que es la ${letters[suggested]}: ${q.options[suggested]}"`;
  messageEl.className = 'message';
});

btnAudience.addEventListener('click', () => {
  if (!lifelines.audience || answered || gameOver) return;
  lifelines.audience = false;
  btnAudience.disabled = true;
  const q = questions[currentIndex];
  const letters = ['A', 'B', 'C', 'D'];
  let percentages = q.options.map(() => Math.random() * 30 + 5);
  percentages[q.correct] += Math.random() * 30 + 30;
  const total = percentages.reduce((a, b) => a + b, 0);
  percentages = percentages.map(p => Math.round((p / total) * 100));
  const diff = 100 - percentages.reduce((a, b) => a + b, 0);
  percentages[q.correct] += diff;

  audienceBars.innerHTML = '';
  percentages.forEach((pct, i) => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `<span class="label">${letters[i]}</span><div class="bar-container"><div class="bar-fill" data-pct="${pct}"></div></div><span class="pct">${pct}%</span>`;
    audienceBars.appendChild(row);
  });
  audienceModal.classList.add('show');
  setTimeout(() => {
    audienceBars.querySelectorAll('.bar-fill').forEach(bar => { bar.style.width = bar.dataset.pct + '%'; });
  }, 50);
});

closeAudience.addEventListener('click', () => audienceModal.classList.remove('show'));

/* ============================================================
   REINICIAR
   ============================================================ */
function resetGame() {
  currentIndex = 0;
  gameOver = false;
  answered = false;
  secondChanceUsed = false;
  lifelines = { fifty: true, call: true, audience: true };
  restartBtn.classList.remove('show');
  victoryScreen.classList.remove('show');
  defeatScreen.classList.remove('show');
  defeatIcon.classList.remove('animate-x');
  
  victoryScreen.querySelectorAll('.confetti').forEach(c => c.remove());
  
  buildLadder();
  showQuestion();
}

restartBtn.addEventListener('click', resetGame);
document.getElementById('playAgainBtn').addEventListener('click', resetGame);

/* ============================================================
   INICIO
   ============================================================ */
buildLadder();
showQuestion();
</script>
</body>
</html>
